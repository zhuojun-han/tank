name: Workspace checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Workspace and dataset checks
        run: node tools/check-project.mjs
      - name: Workspace tool tests
        run: node --test tools/tests/*.test.mjs
