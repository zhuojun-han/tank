name: Web checks

on:
  push:
    paths: ['web-demo/**', '!web-demo/**/*.md', 'contracts/**', 'datasets/**', 'resource/**', 'project-workspace.json', '.gitattributes', '.github/workflows/web.yml']
  pull_request:
    paths: ['web-demo/**', '!web-demo/**/*.md', 'contracts/**', 'datasets/**', 'resource/**', 'project-workspace.json', '.gitattributes', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-demo/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-failure-evidence
          path: |
            web-demo/test-results/
            web-demo/playwright-report/
            web-demo/artifacts/
