name: Web checks

on:
  push:
    paths: ['web-demo/**', 'contracts/**', 'datasets/**', 'resource/**', 'tools/**', 'docs/**', 'README.md', 'AGENTS.md', 'project-workspace.json', '.gitattributes', '.gitignore', '.github/workflows/web.yml']
  pull_request:
    paths: ['web-demo/**', 'contracts/**', 'datasets/**', 'resource/**', 'tools/**', 'docs/**', 'README.md', 'AGENTS.md', 'project-workspace.json', '.gitattributes', '.gitignore', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-demo/package-lock.json
      - name: Workspace and dataset checks
        working-directory: .
        run: node tools/check-project.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-failure-evidence
          path: |
            web-demo/test-results/
            web-demo/playwright-report/
            web-demo/artifacts/
